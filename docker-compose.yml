# Runs the demo on this machine as one container and one Node process.
#
# Every setting is in src/config.js, except the two secrets. Those come from this machine's
# environment, and Compose passes them into the container. A real partner reads them from
# its vault instead. If they are not set, the demo still starts and every page names what
# is missing.
name: etoro-partner-sso-demo
services:
  partner-demo:
    build: .
    environment:
      ETORO_CLIENT_SECRET: ${ETORO_CLIENT_SECRET:-}
      ETORO_APP_KEY: ${ETORO_APP_KEY:-}
    ports:
      - "3000:3000"
